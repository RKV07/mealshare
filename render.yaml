services:
  # Backend — Django API
  - type: web
    name: mealshare-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn mealshare.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: DB_NAME
        fromDatabase:
          name: mealshare-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: mealshare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mealshare-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: mealshare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mealshare-db
          property: port
      - key: CORS_ALLOWED_ORIGINS
        value: https://mealshare-frontend.vercel.app

  # Frontend — React (deploy separately to Vercel, this is just for reference)

databases:
  - name: mealshare-db
    databaseName: mealshare_db
    user: mealshare_user
    plan: free
